# Host-port remap so the Crew can run alongside the Session 4/5 and Session 6
# stacks, and reuse the Phoenix instance that is already running.
#
#   backend  (control-plane) -> 9000
#   frontend (web)           -> 4000
#   postgres                 -> 5433
#   redis                    -> 6381
#   mcp-*                    -> 9001-9005 (already free, unchanged)
#
# Phoenix is NOT started here. Traces go to the Session 6 Phoenix on the host
# at :6007 via host.docker.internal, so everything lands in one UI.
#
# Compose APPENDS port lists on merge, so every remap needs !override or the
# original host port stays bound as well.

x-phoenix: &phoenix-endpoint http://host.docker.internal:6007

services:
  phoenix:
    # reuse the running instance instead of starting a second one
    profiles: ["unused"]

  postgres:
    ports: !override ["5433:5432"]

  redis:
    ports: !override ["6381:6379"]

  control-plane:
    ports: !override ["9000:8001"]
    environment:
      PHOENIX_COLLECTOR_ENDPOINT: *phoenix-endpoint
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    # the "ui" profile comment in the base compose is stale — apps/web has source
    profiles: !override []
    ports: !override ["4000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:9000
      NEXT_PUBLIC_WS_URL: ws://localhost:9000

  mcp-tickets:
    environment:
      PHOENIX_COLLECTOR_ENDPOINT: *phoenix-endpoint
    extra_hosts: ["host.docker.internal:host-gateway"]
  mcp-github:
    environment:
      PHOENIX_COLLECTOR_ENDPOINT: *phoenix-endpoint
    extra_hosts: ["host.docker.internal:host-gateway"]
  mcp-sandbox:
    environment:
      PHOENIX_COLLECTOR_ENDPOINT: *phoenix-endpoint
    extra_hosts: ["host.docker.internal:host-gateway"]
  mcp-browser:
    environment:
      PHOENIX_COLLECTOR_ENDPOINT: *phoenix-endpoint
    extra_hosts: ["host.docker.internal:host-gateway"]
