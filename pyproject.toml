[project]
name = "hubbleflow-crew"
version = "0.2.0"
description = "An autonomous engineering team. Each specialist runs a DeepAgents harness in its own container."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "agents", "mocks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PTH"]
ignore = ["ANN401", "B008"]        # Any in **kwargs; FastAPI Depends in defaults

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "ANN"]
"_build_*.py" = ["ALL"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true      # deepagents/langchain ship partial stubs
files = ["apps", "agents", "mocks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
