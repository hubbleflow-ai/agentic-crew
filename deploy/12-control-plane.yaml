# The control plane · the only thing in the cluster allowed to launch agents.
#
# It runs as `crew-control-plane`, whose Role permits creating and reading Jobs
# and reading pod logs, and nothing else. It cannot create Deployments, read
# Secrets it was not given, or touch another namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: crew
  labels: {app: control-plane}
spec:
  replicas: 1
  # Recreate, not RollingUpdate. The control plane runs the single subscriber
  # that writes project history; a rolling update overlaps two pods, both
  # recorders append, and the transcript gains duplicate events for the few
  # seconds they coexist. One at a time, at the cost of a blink of downtime.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: control-plane}
  template:
    metadata:
      labels: {app: control-plane}
    spec:
      serviceAccountName: crew-control-plane
      securityContext: {runAsNonRoot: true, runAsUser: 1000}
      containers:
        - name: api
          image: crew-base:dev
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - apps.control_plane.api.app:app
            - --host=0.0.0.0
            - --port=8000
          ports: [{containerPort: 8000, name: http}]
          env:
            - name: CREW_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: CREW_AGENT_IMAGE
              value: crew-base:dev
            - name: REDIS_URL
              value: redis://redis:6379/0
          envFrom:
            - configMapRef: {name: crew-config}
            - secretRef: {name: crew-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1, memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: crew
spec:
  selector: {app: control-plane}
  ports: [{port: 8000, targetPort: http}]
