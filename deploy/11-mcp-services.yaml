# Runs agent-written code. See ADR: execution happens in a Job, not here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-sandbox
  namespace: crew
  labels: {app: mcp-sandbox}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mcp-sandbox}
  template:
    metadata:
      labels: {app: mcp-sandbox}
    spec:
      serviceAccountName: crew-sandbox
      securityContext: {runAsNonRoot: true, runAsUser: 1000}
      containers:
        - name: server
          image: crew-base:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "mocks.mcp_sandbox.main:app", "--host", "0.0.0.0", "--port", "9003"]
          ports: [{containerPort: 9003, name: http}]
          envFrom:
            - configMapRef: {name: crew-config}
            - secretRef: {name: crew-secrets}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: crew-workspace}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-sandbox
  namespace: crew
spec:
  selector: {app: mcp-sandbox}
  ports: [{port: 9003, targetPort: http}]
---
# A real headless Chromium, for the PM's evidence trail.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-browser
  namespace: crew
  labels: {app: mcp-browser}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mcp-browser}
  template:
    metadata:
      labels: {app: mcp-browser}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000}
      containers:
        - name: server
          image: crew-browser:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "mocks.mcp_browser.main:app", "--host", "0.0.0.0", "--port", "9004"]
          ports: [{containerPort: 9004, name: http}]
          envFrom:
            - configMapRef: {name: crew-config}
            - secretRef: {name: crew-secrets}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 2, memory: 2Gi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: crew-workspace}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-browser
  namespace: crew
spec:
  selector: {app: mcp-browser}
  ports: [{port: 9004, targetPort: http}]
