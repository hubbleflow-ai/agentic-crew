# The MCP services · each one a capability the crew can reach over HTTP.
#
# They are stand-ins for real SaaS, and that is the point: an agent calling
# `github_open_pr` cannot tell the difference, so the harness lesson does not
# depend on anyone holding a GitHub token.
#
# All five are structurally identical -- Deployment plus Service, no storage,
# no cluster permissions. Only mcp-browser differs, because Chromium is a
# gigabyte nothing else needs.
---
# The one ticket per project · the crew's source of truth for scope.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-tickets
  namespace: crew
  labels: {app: mcp-tickets}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mcp-tickets}
  template:
    metadata:
      labels: {app: mcp-tickets}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000}
      containers:
        - name: server
          image: crew-base:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "mocks.mcp_tickets.main:app", "--host", "0.0.0.0", "--port", "9001"]
          ports: [{containerPort: 9001, name: http}]
          envFrom:
            - configMapRef: {name: crew-config}
            - secretRef: {name: crew-secrets}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: crew-workspace}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-tickets
  namespace: crew
spec:
  selector: {app: mcp-tickets}
  ports: [{port: 9001, targetPort: http}]
---
