# Non-secret settings every agent needs. Editing this and restarting is how you
# change the model for the whole crew · no image rebuild, no code change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: crew-config
  namespace: crew
data:
  GEMINI_MODEL: "gemini-3.5-flash"
  LOG_LEVEL: "INFO"
  # In-cluster service names · agents never hold a hostname of their own.
  CONTROL_PLANE_URL: "http://control-plane.crew.svc.cluster.local:8000"
  LOKI_URL: "http://loki.crew.svc.cluster.local:3100"
  # Phoenix runs in the cluster. It used to point at the developer's laptop,
  # which worked until the laptop slept · an agent whose collector is
  # unreachable does not fail, it stalls on export retries.
  PHOENIX_COLLECTOR_ENDPOINT: "http://phoenix.crew.svc.cluster.local:6006"
