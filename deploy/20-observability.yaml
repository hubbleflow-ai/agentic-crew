# Three things, answering three different questions.
#
#   Loki     · "what happened?"        -- every log line from every agent
#   Grafana  · "show me"               -- one place to read and filter them
#   Phoenix  · "what did the model do?" -- prompts, completions, token spend
#
# All three run in-cluster. Pointing them at the developer's laptop worked
# until the laptop was asleep, and an agent whose collector is unreachable
# does not fail loudly -- it slows to a crawl on export retries.
#
# None of them keep data across a restart. They are for watching a demo, not
# for retaining an audit trail.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: crew
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      log_level: warn
    common:
      instance_addr: 127.0.0.1
      path_prefix: /tmp/loki
      storage:
        filesystem:
          chunks_directory: /tmp/loki/chunks
          rules_directory: /tmp/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      # Agents emit bursts -- a tool call fans out into many lines at once.
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      reject_old_samples: false
      allow_structured_metadata: false
    ruler:
      alertmanager_url: http://localhost:9093
    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: crew
  labels: {app: loki}
spec:
  replicas: 1
  selector:
    matchLabels: {app: loki}
  template:
    metadata:
      labels: {app: loki}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: loki
          image: grafana/loki:3.3.2
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports: [{containerPort: 3100, name: http}]
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /tmp/loki}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1, memory: 1Gi}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - {name: config, configMap: {name: loki-config}}
        - {name: data, emptyDir: {sizeLimit: 2Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: crew
spec:
  selector: {app: loki}
  ports: [{port: 3100, targetPort: http}]
---
# Grafana finds Loki and Phoenix by itself · nobody should have to click
# through "add a data source" before they can read a log.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: crew
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.crew.svc.cluster.local:3100
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: crew
        folder: Crew
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: crew
  labels: {app: grafana}
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 472, fsGroup: 472}
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports: [{containerPort: 3000, name: http}]
          env:
            # A teaching cluster on a laptop · a login screen between the
            # cohort and the logs teaches nothing. Never do this elsewhere.
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Admin"}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
          volumeMounts:
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
            - {name: data, mountPath: /var/lib/grafana}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1, memory: 1Gi}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - {name: config, configMap: {name: grafana-config}}
        - {name: dashboards, configMap: {name: grafana-dashboards}}
        - {name: data, emptyDir: {sizeLimit: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: crew
spec:
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: http}]
---
# Phoenix · the model's own trace. Every Gemini call, its prompt, its
# completion, and what it cost.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: crew
  labels: {app: phoenix}
spec:
  replicas: 1
  selector:
    matchLabels: {app: phoenix}
  template:
    metadata:
      labels: {app: phoenix}
    spec:
      # Kubernetes injects a legacy env var per Service in the namespace --
      # PHOENIX_PORT becomes "tcp://10.x.x.x:6006" because our Service is
      # named `phoenix`. Phoenix reads that same name expecting an integer and
      # refuses to start. Turning the links off removes the whole class of
      # collision; nothing here discovers services that way.
      enableServiceLinks: false
      containers:
        - name: phoenix
          image: arizephoenix/phoenix:version-8.26.0
          ports:
            - {containerPort: 6006, name: ui}
            - {containerPort: 4317, name: otlp-grpc}
          env:
            - {name: PHOENIX_WORKING_DIR, value: /tmp/phoenix}
            # Belt and braces · explicit, so this survives someone turning
            # service links back on.
            - {name: PHOENIX_PORT, value: "6006"}
            - {name: PHOENIX_HOST, value: "0.0.0.0"}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: 2, memory: 2Gi}
          readinessProbe:
            httpGet: {path: /healthz, port: ui}
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /tmp/phoenix}
      volumes:
        - {name: data, emptyDir: {sizeLimit: 2Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix
  namespace: crew
spec:
  selector: {app: phoenix}
  ports:
    - {name: ui, port: 6006, targetPort: ui}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
