# The spawn caps in domain/caps.py are the *polite* limit · they refuse in
# words a model can act on. This quota is the limit that does not negotiate.
#
# Both exist on purpose. Application code can have a bug; a ResourceQuota is
# enforced by the API server, so a runaway spawn loop fails at admission
# rather than filling the node.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: crew-quota
  namespace: crew
spec:
  hard:
    pods: "40"

    # `requests` is what the scheduler actually reserves, so this is the real
    # constraint on a 10-CPU node. Keep it tight.
    requests.cpu: "8"
    requests.memory: 12Gi

    # `limits` is only a ceiling -- a pod that asks for a 1-CPU limit and then
    # idles still spends that against the quota. Sizing this like `requests`
    # is what starved Phoenix: the platform had reserved 11.5 of 12 CPU of
    # *ceiling* while using almost none of it, and there was no room left to
    # create anything. Over-commit deliberately.
    limits.cpu: "32"
    limits.memory: 32Gi

    persistentvolumeclaims: "4"
---
# A pod with no limits can eat the node. This makes the defaults explicit for
# anything that forgets to ask.
apiVersion: v1
kind: LimitRange
metadata:
  name: crew-defaults
  namespace: crew
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
