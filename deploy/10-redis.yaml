# Redis carries the live event stream and directed messages between agents.
#
# Nothing durable lives here. If this pod is lost, an in-flight turn is lost
# with it; the project's history is in the store and the work is on the volume.
# That is why there is no PVC and no replication -- treating it as disposable
# is a design decision, not an omission.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: crew
  labels: {app: redis}
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 999}
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports: [{containerPort: 6379, name: redis}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: crew
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: redis}]
